[production]
# Production servers
# ansible_host=your-server-ip-or-domain
# ansible_user=root
# ansible_ssh_private_key_file=~/.ssh/id_rsa

[staging]
# Staging servers
# ansible_host=staging-server-ip
# ansible_user=deploy
# ansible_ssh_private_key_file=~/.ssh/staging_key

[local]
localhost ansible_connection=local

[all:vars]
# Application variables
git_repo=https://github.com/your-org/ai-asylum.git
git_branch=main
database_url=postgresql://aiasylum:aiasylum@localhost:5432/aiasylum

# API Keys (set via --extra-vars or vault)
# openai_api_key=sk-...
# anthropic_api_key=sk-ant-...
# google_api_key=...

# Security (set via --extra-vars or vault)
# api_secret_key=change-me-in-production
# jwt_secret_key=change-me-in-production
# api_key_hmac_secret=change-me-in-production

# CORS
cors_origins=https://yourdomain.com,https://api.yourdomain.com
