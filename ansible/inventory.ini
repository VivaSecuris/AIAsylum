[production]
# Production servers
# ansible_host=your-server-ip-or-domain
# ansible_user=root
# ansible_ssh_private_key_file=~/.ssh/id_rsa

[staging]
# Staging servers
# ansible_host=staging-server-ip
# ansible_user=deploy
# ansible_ssh_private_key_file=~/.ssh/staging_key

[local]
localhost ansible_connection=local

[all:vars]
# Application variables
git_repo=https://github.com/VivaSecuris/AIAsylum.git
git_branch=main
# Set a real password via --extra-vars or Ansible Vault. This value is a placeholder.
database_url=postgresql://aiasylum:SET_VIA_VAULT@localhost:5432/aiasylum

# API Keys (set via --extra-vars or vault)
# openai_api_key=sk-...
# anthropic_api_key=sk-ant-...
# google_api_key=...

# Security (set via --extra-vars or vault)
# api_secret_key=        # required; set via vault
# jwt_secret_key=        # required; set via vault
# api_key_hmac_secret=   # required; set via vault
# require_auth=true
# session_cookie_secure=true

# CORS
cors_origins=https://yourdomain.com,https://api.yourdomain.com
